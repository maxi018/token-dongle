; Claude Token Monitor — firmware para LILYGO T-Dongle-C5 (ESP32-C5)
;
; Plataforma: pioarduino (fork comunitario de platform-espressif32 que trae
; arduino-esp32 3.x, el único core Arduino con soporte de ESP32-C5).
; Fijamos una release concreta (55.03.312-1 => arduino-esp32 3.3.12 / ESP-IDF 5.5)
; en vez de "develop" como hace el repo de LilyGO, así el build es reproducible.

[platformio]
default_envs = t-dongle-c5
boards_dir = boards

[env:t-dongle-c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
; boards/lilygo-t-dongle-c5.json = copia del board oficial de LilyGO
; (Xinyuan-LilyGO/T-Dongle-C5/board/Lilygo-T-Dongle-C5.json): 16MB flash QIO, 8MB PSRAM.
board = lilygo-t-dongle-c5
framework = arduino

; El C5 solo tiene USB Serial/JTAG: Serial = HWCDC sobre ese periférico.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Versiones exactas para que el build sea reproducible.
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    bblanchon/ArduinoJson@7.4.3

monitor_speed = 115200
; En USB Serial/JTAG la velocidad se ignora; está por prolijidad.
upload_speed = 460800
